<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluar Actividades Realizadas</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <h1>Evaluación de Actividades Realizadas</h1>
    </header>
    
    <main>
        <section>
            <h2>Listado de Actividades Realizadas</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Inicio</th>
                        <th>Sector</th>
                        <th>Nombre</th>
                        <th>Tema</th>
                        <th>Nota Promedio</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="actividades-list">
                    <!-- Las actividades se cargarán aquí mediante JavaScript -->
                </tbody>
            </table>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 Plataforma de Actividades Recreativas</p>
    </footer>

    <script src="/js/notas.js"></script>
</body>
</html>
