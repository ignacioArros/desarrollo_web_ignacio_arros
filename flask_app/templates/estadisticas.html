<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="../static/css/estadisticas.css">
</head>
<body>
    <header>
        <h1>Estadísticas de Actividades</h1>
    </header>
    
    <main>
        <section>
            <h2>Resumen General</h2>
            <ul>
                <li>Total de Actividades: <span id="total-actividades"></span></li>
                <li>Región con más eventos: <span id="region-top"></span></li>
                <li>Temática más frecuente: <span id="tema-top"></span></li>
            </ul>
        </section>
        
        <section>
            <h2>Visualización de Datos</h2>
            <div id="grafico-lineas" style="width: 100%; height: 400px; margin-bottom: 40px;"></div>
            <div id="grafico-torta" style="width: 100%; height: 400px; margin-bottom: 40px;"></div>
            <div id="grafico-barras" style="width: 100%; height: 400px; margin-bottom: 40px;"></div>
        </section>
        <div>
            <nav>
                <ul>
                    <li><a href="{{ url_for('index') }}">Volver al Inicio</a></li>
                </ul>
            </nav>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 Plataforma de Actividades Recreativas</p>
    </footer>

    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Resumen General
        fetch("/api/estadisticas/resumen_general")
            .then(res => res.json())
            .then(data => {
                document.getElementById("total-actividades").textContent = data.total_actividades;
                document.getElementById("region-top").textContent = data.region_top;
                document.getElementById("tema-top").textContent = data.tema_top.charAt(0).toUpperCase() + data.tema_top.slice(1);
            });

        // Gráfico de líneas
        fetch("/api/estadisticas/actividades_por_dia")
            .then(res => res.json())
            .then(data => {
                Highcharts.chart('grafico-lineas', {
                    chart: { type: 'line' },
                    title: { text: 'Actividades por Día' },
                    xAxis: { categories: data.dias },
                    yAxis: { title: { text: 'Cantidad de Actividades' } },
                    series: [{
                        name: 'Actividades',
                        data: data.cantidades
                    }]
                });
            });

        // Gráfico de torta
        fetch("/api/estadisticas/actividades_por_tipo")
            .then(res => res.json())
            .then(data => {
                Highcharts.chart('grafico-torta', {
                    chart: { type: 'pie' },
                    title: { text: 'Actividades por Tipo' },
                    series: [{
                        name: 'Cantidad',
                        colorByPoint: true,
                        data: data.tipos.map((tipo, i) => ({
                            name: tipo,
                            y: data.cantidades[i]
                        }))
                    }]
                });
            });

        // Gráfico de barras
        fetch("/api/estadisticas/actividades_por_horario")
            .then(res => res.json())
            .then(data => {
                Highcharts.chart('grafico-barras', {
                    chart: { type: 'column' },
                    title: { text: 'Actividades por Horario y Mes' },
                    xAxis: { categories: data.meses },
                    yAxis: { min: 0, title: { text: 'Cantidad de Actividades' } },
                    series: [
                        { name: 'Mañana', data: data.manana },
                        { name: 'Mediodía', data: data.mediodia },
                        { name: 'Tarde', data: data.tarde }
                    ]
                });
            });
    });
    </script>
</body>
</html>
